model:
  name: Qwen/Qwen2.5-0.5B-Instruct

data:
  dataset: yahma/alpaca-cleaned
  split: train
  sample_size: 500
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: checkpoints/qwen2.5-0.5b-lora
  learning_rate: 0.0002
  num_train_epochs: 1
  max_steps: 50
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  max_length: 512
  logging_steps: 5
  save_steps: 25
  seed: 42
