[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-post-training-evaluation-platform"
version = "0.2.0"
description = "Reproducible LLM post-training, evaluation, and inference benchmarking platform"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=2.20",
  "accelerate>=0.34",
  "trl>=0.20",
  "peft>=0.15",
  "pyyaml>=6.0",
  "psutil>=5.9",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
